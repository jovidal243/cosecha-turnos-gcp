name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Pruebas
        run: python -m pytest -q
      - name: Construir imágenes Docker
        run: |
          for s in ms_asistencia ms_validacion ms_reportes; do
            docker build --build-arg SERVICIO=$s -t $s:ci .
          done
