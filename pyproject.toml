[project]
name = "cosecha-turnos-gcp"
version = "1.0.0"
description = "Gestión y validación inteligente de turnos y asistencia - Gerencia de Cosecha (proyecto académico, datos sintéticos)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
